<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Online Test</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    overflow: hidden;
  }

  #warningScreen {
    position: fixed;
    inset: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    z-index: 9999;
  }

  #startBtn {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    background: #00b894;
    color: white;
    margin-top: 20px;
  }

  #timer {
    position: fixed;
    top: 10px;
    right: 20px;
    background: black;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 22px;
    z-index: 1000;
  }

  iframe {
    width: 100vw;
    height: 100vh;
    border: none;
  }

  #logBox {
    position: fixed;
    bottom: 10px;
    left: 10px;
    background: black;
    color: #00ff00;
    padding: 10px;
    font-size: 12px;
    max-width: 300px;
    z-index: 2000;
  }

  #controlPanel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    display: none;
    z-index: 9999;
  }

  #controlPanel button {
    padding: 15px 20px;
    font-size: 16px;
    margin: 10px;
    cursor: pointer;
  }

  #submitExitBtn {
    background: red;
    color: white;
    border: none;
  }
</style>
</head>

<body>

<div id="warningScreen">
  <h1>Online Test Rules</h1>

  <p>
    • Fullscreen required<br><br>
    • 40 minutes duration<br><br>
    • Do NOT switch tabs<br><br>
    • Violations are logged and reported
  </p>

  <button id="startBtn">Start Test</button>
</div>

<div id="timer">40:00</div>

<div id="logBox">
  <b>Activity Log</b>
  <div id="logContent"></div>
</div>

<!-- CONTROL PANEL -->
<div id="controlPanel">

  <h3>Fullscreen Required</h3>

  <button id="reenterBtn">Re-enter Fullscreen</button>
  <button id="submitExitBtn">Submit & Exit Test</button>

</div>

<!-- GOOGLE FORM -->
<iframe src="https://docs.google.com/forms/d/e/1FAIpQLScg1PYiM-h9NnkjDzM0oG0fzyL26ovUesSjnBhBjrysBXXd4g/viewform?embedded=true"></iframe>

<script>

// ---------------- VARIABLES ----------------
let studentID = prompt("Enter your Student ID:");

if (!studentID) {
  alert("Student ID is required.");
  location.reload();
}

let timeLeft = 40 * 60;
let tabSwitchCount = 0;
let maxViolations = 3;
let activityLog = [];
let allowExit = false;

// ---------------- ELEMENTS ----------------
const startBtn = document.getElementById("startBtn");
const warningScreen = document.getElementById("warningScreen");
const timerDisplay = document.getElementById("timer");
const controlPanel = document.getElementById("controlPanel");

// ---------------- START TEST ----------------
startBtn.addEventListener("click", async () => {

  if (document.documentElement.requestFullscreen) {
    await document.documentElement.requestFullscreen();
  }

  warningScreen.style.display = "none";

  startTimer();
});

// ---------------- TIMER ----------------
function startTimer() {

  const timer = setInterval(() => {

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    timerDisplay.textContent =
      `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

    timeLeft--;

    if (timeLeft < 0) {
      clearInterval(timer);
      submitTest("Time expired");
    }

  }, 1000);
}

// ---------------- TAB SWITCH ----------------
document.addEventListener("visibilitychange", () => {

  if (document.hidden) {

    tabSwitchCount++;

    logEvent("Tab switch detected");

    alert(`Warning! Tab switch detected (${tabSwitchCount}/${maxViolations}).`);

    if (tabSwitchCount >= maxViolations) {
      submitTest("Too many tab switches");
    }
  }
});

// ---------------- FULLSCREEN CONTROL ----------------
document.addEventListener("fullscreenchange", () => {

  if (!document.fullscreenElement) {

    if (allowExit) return;

    tabSwitchCount++;

    logEvent("Exited fullscreen");

    alert("WARNING: You exited fullscreen mode.\nUse the buttons to continue.");

    controlPanel.style.display = "block";

    if (tabSwitchCount >= maxViolations) {
      submitTest("Too many fullscreen exits");
    }

  } else {
    controlPanel.style.display = "none";
  }

});

// ---------------- BUTTONS ----------------
document.getElementById("reenterBtn").addEventListener("click", async () => {
  try {
    await document.documentElement.requestFullscreen();
  } catch (e) {
    alert("Could not enter fullscreen. Try again.");
  }
});

document.getElementById("submitExitBtn").addEventListener("click", () => {
  submitTest("Student submitted test");
});

// ---------------- LOG ----------------
function logEvent(event) {

  let time = new Date().toLocaleTimeString();

  activityLog.push({
    time: time,
    event: event
  });
}

// ---------------- DISPLAY LOG ----------------
setInterval(() => {

  document.getElementById("logContent").innerHTML =
    activityLog.map(l => `${l.time} - ${l.event}`).join("<br>");

}, 2000);

// ---------------- SUBMIT TEST ----------------
function submitTest(reason) {

  allowExit = true;

  document.exitFullscreen();

  controlPanel.style.display = "none";

  logEvent("SUBMIT: " + reason);

  alert("Test submitted: " + reason);

  window.location.href = "about:blank";
}

</script>

</body>
</html>
