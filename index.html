<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Secure Online Test</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0a2342;
    color: white;
    overflow: hidden;
  }

  /* START SCREEN */
  #warningScreen {
    position: fixed;
    inset: 0;
    background: #0a2342;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    z-index: 9999;
  }

  #startBtn {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    background: #00b894;
    color: white;
    margin-top: 20px;
  }

  /* TIMER */
  #timer {
    position: fixed;
    top: 10px;
    right: 20px;
    background: black;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 22px;
    z-index: 1000;
  }

  /* FORM */
  iframe {
    width: 100vw;
    height: 100vh;
    border: none;
  }

  /* EXIT UI */
  #exitWrapper {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 9999999;
    display: none;
    flex-direction: column;
    align-items: center;
  }

  #exitWarningText {
    background: #ffd700;
    color: black;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    width: 180px;
    text-align: center;
    margin-bottom: 10px;
  }

  #exitTestBtn {
    padding: 15px;
    font-size: 14px;
    background: red;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    width: 180px;
  }

  /* FULLSCREEN WARNING PANEL */
  #controlPanel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.95);
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    display: none;
    z-index: 99999;
  }

  #controlPanel button {
    padding: 15px 20px;
    font-size: 16px;
    margin-top: 10px;
    cursor: pointer;
  }

  /* ACTIVITY LOG */
  #logBox {
    position: fixed;
    bottom: 10px;
    left: 10px;
    background: black;
    color: #00ff00;
    padding: 10px;
    font-size: 12px;
    max-width: 320px;
    z-index: 2000;
    border-radius: 8px;
  }
</style>
</head>

<body>

<!-- START SCREEN -->
<div id="warningScreen">
  <h1>Secure Online Test</h1>

  <p>
    • Fullscreen required<br><br>
    • 40-minute timer<br><br>
    • No tab switching allowed<br><br>
    • Violations are recorded
  </p>

  <button id="startBtn">Start Test</button>
</div>

<!-- TIMER -->
<div id="timer">40:00</div>

<!-- EXIT UI -->
<div id="exitWrapper">
  <div id="exitWarningText">
    Submit your assessment before exiting.
  </div>

  <button id="exitTestBtn">Exit Test</button>
</div>

<!-- FULLSCREEN WARNING -->
<div id="controlPanel">
  <h3>You exited fullscreen</h3>
  <p>Please return to continue the test</p>

  <button id="reenterBtn">Re-enter Fullscreen</button>
</div>

<!-- ACTIVITY LOG -->
<div id="logBox">
  <b>Activity Log</b>
  <div id="logContent"></div>
</div>

<!-- GOOGLE FORM -->
<iframe src="https://docs.google.com/forms/d/e/1FAIpQLScg1PYiM-h9NnkjDzM0oG0fzyL26ovUesSjnBhBjrysBXXd4g/viewform?embedded=true"></iframe>

<script>

// ---------------- STUDENT ID ----------------
let studentID = prompt("Enter your Student ID:");

if (!studentID) {
  alert("Student ID required.");
  location.reload();
}

// ---------------- VARIABLES ----------------
let timeLeft = 40 * 60;
let tabSwitchCount = 0;
let maxViolations = 3;
let activityLog = [];
let allowExit = false;

// ---------------- ELEMENTS ----------------
const startBtn = document.getElementById("startBtn");
const warningScreen = document.getElementById("warningScreen");
const timerDisplay = document.getElementById("timer");
const controlPanel = document.getElementById("controlPanel");
const exitWrapper = document.getElementById("exitWrapper");

// ---------------- START TEST ----------------
startBtn.addEventListener("click", async () => {

  await document.documentElement.requestFullscreen().catch(() => {});

  warningScreen.style.display = "none";

  // show exit button only after test starts
  exitWrapper.style.display = "flex";

  startTimer();
  startWatchdog();
});

// ---------------- TIMER ----------------
function startTimer() {

  setInterval(() => {

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    timerDisplay.textContent =
      `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

    timeLeft--;

    if (timeLeft < 0) {
      submitTest("Time expired");
    }

  }, 1000);
}

// ---------------- FULLSCREEN WATCHDOG ----------------
function startWatchdog() {

  setInterval(() => {

    if (!document.fullscreenElement && !allowExit) {

      controlPanel.style.display = "block";

      logEvent("Fullscreen lost and reported to admin");

    }

  }, 500);
}

// ---------------- TAB SWITCH DETECTION ----------------
document.addEventListener("visibilitychange", () => {

  if (document.hidden) {

    tabSwitchCount++;

    logEvent("Tab switch detected");

    alert(`Warning (${tabSwitchCount}/${maxViolations})`);

    if (tabSwitchCount >= maxViolations) {
      submitTest("Too many tab switches");
    }
  }
});

// ---------------- EXIT TEST BUTTON ----------------
document.getElementById("exitTestBtn").addEventListener("click", () => {

  const confirmExit = confirm(
    "Exit Test?\nPlease ensure you have submitted your answers."
  );

  if (!confirmExit) return;

  allowExit = true;

  submitTest("Clean exit via exit button");
});

// ---------------- RE-ENTER FULLSCREEN ----------------
document.getElementById("reenterBtn").addEventListener("click", async () => {

  await document.documentElement.requestFullscreen().catch(() => {});

  controlPanel.style.display = "none";

});

// ---------------- LOG SYSTEM ----------------
function logEvent(event) {

  let time = new Date().toLocaleTimeString();

  activityLog.push({
    time: time,
    event: event
  });

  document.getElementById("logContent").innerHTML =
    activityLog.map(log =>
      `${log.time} - ${log.event}`
    ).join("<br>");
}

// ---------------- SUBMIT TEST ----------------
function submitTest(reason) {

  allowExit = true;

  controlPanel.style.display = "none";
  exitWrapper.style.display = "none";

  document.exitFullscreen().catch(() => {});

  logEvent("SUBMIT: " + reason);

  alert("Test ended: " + reason);

  window.location.href = "about:blank";
}

</script>

</body>
</html>
